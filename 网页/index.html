rd-items a:hover{border-color:#b8d2ed;background:#f7fbff;color:var(--accent)}.card-items strong{display:block;font-size:13px;font-weight:600}.card-items span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.card-items b{position:absolute;right:13px;top:13px;color:#a0a8ac;font-size:14px;font-weight:400}.card-items a:hover b{color:var(--accent)}.empty-card{margin:45px 0 0;color:#a2a8ab;font-size:13px}.service-strip{display:flex;align-items:center;justify-content:space-between;gap:50px;max-width:1200px;margin:0 auto;padding:52px 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.service-strip h2{margin:8px 0 0;font-size:27px;font-weight:500;letter-spacing:-.04em}.service-strip>p{max-width:400px;margin:0;color:var(--muted);font-size:13px}.contact-strip{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:25px 30px;color:#6a7275;font-size:13px}.contact-strip a{color:var(--accent);font-weight:600}.site-footer{display:flex;justify-content:space-between;max-width:1200px;margin:0 auto;padding:25px 30px 42px;color:#9aa1a4;font-size:11px}.site-footer a:hover{color:var(--accent)}.toast{position:fixed;left:50%;bottom:28px;z-index:10;padding:11px 17px;border:1px solid #b9cfe7;border-radius:999px;background:#f4f9ff;color:var(--accent);font-size:12px;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.site-header{height:75px;padding:0 22px}.main-nav{gap:17px}.main-nav a{padding:25px 0;font-size:12px}.main-nav a:after{bottom:17px}.language{min-width:45px;padding:7px 10px}.hero{padding:72px 20px 68px}.product-section{padding:25px 18px 70px}.product-grid{grid-template-columns:1fr}.product-card-wide{grid-column:span 1}.card-items{grid-template-columns:1fr}.section-title{display:block}.section-title h2{margin-top:7px}.section-title span{display:block;margin:8px 0 0}.service-strip{display:block;padding:4 @media(max-width:800px){html{scroll-padding-top:91px}}

.documents-action{display:block;min-height:180px;background:#eef5ff;border-color:#c6daf5;transition:transform .22s,background .22s,border-color .22s}
.documents-action:hover{border-color:#98bce9;background:#e4efff;box-shadow:none}
.documents-action:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.documents-action .card-head{border-color:#c6daf5}
.documents-action .card-head h3,.documents-action .card-arrow{color:#1756a5}
.documents-action .card-head p{color:#4d6683}
.documents-action .selection-description{margin:18px 0 0;color:#385779;font-size:13px;line-height:1.7}
@media(max-width:800px){#documents{grid-template-columns:minmax(0,1fr);gap:16px}}
@media(max-width:560px){html:lang(en) .main-nav{gap:8px}}

    <script>
const navigationLinks = Array.from(document.querySelectorAll('.main-nav a[href^="#"]'));
const navigationTargets = navigationLinks.map((link) => ({
  hash: link.hash,
  element: document.querySelector(link.hash),
}));
const navigationHeader = document.querySelector('.site-header');
let navigationFrame = 0;

function updateNavigation() {
  navigationFrame = 0;
  const offset = Math.max(
    parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0,
    navigationHeader.getBoundingClientRect().bottom + 16
  );
  const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  const targets = navigationTargets.map(({ hash, element }) => ({
    hash,
    top: Math.min(maxScroll, Math.max(0, element.getBoundingClientRect().top + window.scrollY - offset)),
  }));
  let current = targets[0];
  targets.forEach((target) => {
    if (target.top <= window.scrollY + 2) current = target;
  });
  // Short sections at the page end can share the same reachable scroll position.
  const requested = targets.find((target) => target.hash === location.hash);
  if (requested && Math.abs(requested.top - current.top) <= 2) current = requested;
  navigationLinks.forEach((link) => {
    const active = link.hash === current.hash;
    link.classList.toggle('active', active);
    if (active) link.setAttribute('aria-current', 'location');
    else link.removeAttribute('aria-current');
  });
}

function scheduleNavigationUpdate() {
  if (!navigationFrame) navigationFrame = requestAnimationFrame(updateNavigation);
}

window.addEventListener('scroll', scheduleNavigationUpdate, { passive: true });
window.addEventListener('resize', scheduleNavigationUpdate);
window.addEventListener('hashchange', scheduleNavigationUpdate);
window.addEventListener('pageshow', scheduleNavigationUpdate);
const navigationResizeObserver = new ResizeObserver(scheduleNavigationUpdate);
navigationResizeObserver.observe(document.querySelector('main'));
navigationResizeObserver.observe(navigationHeader);
scheduleNavigationUpdate();

const languageButton = document.querySelector('.language');
const translatedText = Array.from(document.querySelectorAll('[data-en]'), (element) => ({
  element,
  zh: element.textContent,
  en: element.dataset.en,
}));
const translatedAttributes = ['aria-label', 'alt', 'content'].flatMap((attribute) =>
  Array.from(document.querySelectorAll(`[data-en-${attribute}]`), (element) => ({
    element,
    attribute,
    zh: element.getAttribute(attribute),
    en: element.getAttribute(`data-en-${attribute}`),
  }))
);

function setLanguage(language) {
  const isEnglish = language === 'en';
  document.documentElement.lang = isEnglish ? 'en' : 'zh-CN';
  translatedText.forEach(({ element, zh, en }) => {
    element.textContent = isEnglish ? en : zh;
  });
  translatedAttributes.forEach(({ element, attribute, zh, en }) => {
    element.setAttribute(attribute, isEnglish ? en : zh);
  });
  languageButton.textContent = isEnglish ? '中文' : 'EN';
  languageButton.lang = isEnglish ? 'zh-CN' : 'en';
  languageButton.setAttribute('aria-label', isEnglish ? 'Switch to Chinese' : '切换为英文');
  document.dispatchEvent(new CustomEvent('site-language-change'));
}

languageButton.addEventListener('click', () => {
  const language = document.documentElement.lang === 'en' ? 'zh-CN' : 'en';
  setLanguage(language);
  try {
    localStorage.setItem('yoniq-language', language);
  } catch {
    // Switching still works when browser storage is unavailable.
  }
});

let initialLanguage = 'zh-CN';
try {
  initialLanguage = localStorage.getItem('yoniq-language') || initialLanguage;
} catch {
  // Use Chinese when browser storage is unavailable.
}
setLanguage(initialLanguage);

document.querySelectorAll('.product-list a[href^="manuals/"]').forEach((link) => {
  link.addEventListener('click', (event) => {
    event.preventDefault();
    window.alert(document.documentElement.lang === 'en'
      ? 'This manual link is reserved and will open once the file is available.'
      : '该产品手册链接已预留，文件接入后即可打开。');
  });
});
