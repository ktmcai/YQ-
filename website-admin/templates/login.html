{% extends 'base.html' %}
{% block title %}登录内容管理{% endblock %}
{% block main_class %}login-layout{% endblock %}
{% block content %}
<section class="panel login-panel" aria-labelledby="login-title">
  <p class="eyebrow">YONIQ</p>
  <h1 id="login-title">登录内容管理</h1>
  <p class="intro">管理官网产品、上传 PDF，更新产品目录和资料卡片。</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="editor-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" value="admin" required maxlength="80" /></div>
    <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" /></div>
    <button class="button primary" type="submit">登录</button>
  </form>
</section>
{% endblock %}
