{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('dashboard') }}">← 返回文档列表</a>
<div class="page-heading"><div><h1>修改密码</h1><p class="intro">修改成功后，所有已登录的管理会话都会退出。</p></div></div>
<section class="panel editor-panel">
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="editor-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field"><label for="current_password">当前密码</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required maxlength="128" /></div>
    <div class="field"><label for="new_password">新密码</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required /><p class="help">12 至 128 个字符，建议使用多个词语和数字的组合。</p></div>
    <div class="field"><label for="confirm_password">再次输入新密码</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required /></div>
    <div class="form-actions"><button class="button primary" type="submit">保存新密码</button><a class="button quiet" href="{{ url_for('dashboard') }}">取消</a></div>
  </form>
</section>
{% endblock %}
