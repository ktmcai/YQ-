server {
    listen 80;
    server_name yoniqtech.com www.yoniqtech.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://yoniqtech.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yoniqtech.com www.yoniqtech.com;
    root /var/www/yoniq;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/yoniqtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoniqtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YoniqTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/default.d/yoniq-docs.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
